<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5500" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MixOn</title>
    <script>
      // Re-apply the last Material 3 colour scheme before first paint (see src/theme/store.ts).
      try {
        var css = localStorage.getItem('soundfy.theme.css');
        if (css) document.documentElement.setAttribute('style', css);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
