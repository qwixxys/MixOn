name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Every text of the interface has its English translation.
      - run: npm run i18n:check -w client
      - run: npm test
      # The same tests on the SQLite build the standalone Android app uses (sql.js).
      - run: npm run test:sqljs -w server
      - run: npm run build
      - run: npm run build:standalone -w client
