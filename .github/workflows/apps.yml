# Builds the installable apps: Windows installer, Linux AppImage and Android APK.
# Every run keeps them as downloadable artifacts; pushing a tag like v0.1.0 also publishes a GitHub release.
name: Apps

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'client/**'
      - 'server/**'
      - 'desktop/**'
      - 'mobile/**'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Bash on Windows too, so a failing command stops the step (PowerShell would carry on).
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Build server and client
        run: |
          npm ci
          npm run build
      - name: Package the app
        working-directory: desktop
        run: |
          npm ci
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: soundFy-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Prepare the Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      # With the four ANDROID_* secrets set, the APK is signed with your own key and can be updated in place.
      # Without them a debug-signed APK is built: it installs fine, but each update may need a reinstall.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          version=$(node -p "require('../package.json').version")
          ./gradlew ${{ steps.key.outputs.task }} -PversionCode=${{ github.run_number }} -PversionName="$version" --no-daemon
      - name: Name the APK
        run: |
          version=$(node -p "require('./mobile/package.json').version")
          apk=mobile/android/app/build/outputs/apk
          mkdir -p out
          if [ -f "$apk/release/app-release.apk" ]; then
            cp "$apk/release/app-release.apk" "out/soundFy-$version.apk"
          else
            cp "$apk/debug/app-debug.apk" "out/soundFy-$version-debug.apk"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: soundFy-Android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
