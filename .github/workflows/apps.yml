# Builds the installable apps: Windows installer, Linux AppImage and Android APK.
# Every run keeps them as downloadable artifacts. The first push with a new version in package.json (or a v* tag)
# also publishes them as a GitHub release.
name: Apps

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'client/**'
      - 'server/**'
      - 'desktop/**'
      - 'mobile/**'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Bash on Windows too, so a failing command stops the step (PowerShell would carry on).
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
          - name: Linux
            os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Build server and client
        run: |
          npm ci
          npm run build
      # With a code-signing certificate in the WIN_CSC_LINK (base64 .pfx) and WIN_CSC_KEY_PASSWORD secrets, the
      # Windows installer is signed, which is what Windows SmartScreen looks for; without them it is built unsigned.
      - name: Package the app
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm ci
          npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: MixOn-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      # The APK carries the whole app, server included, so it works on the phone without a computer.
      - name: Build the app for the phone
        run: |
          npm ci
          npm run build:standalone -w client
      - name: Prepare the Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      # Always a release build: no debug mode, which phones' app checks (Play Protect) treat with suspicion. With the
      # four ANDROID_* secrets set it is signed with your own key; without them with the key from the repository
      # (mobile/android/app/debug.keystore), the one earlier builds used, so it installs over them and keeps the data.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          version=$(node -p "require('../package.json').version")
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="$version" --no-daemon
      - name: Name the APK
        run: |
          version=$(node -p "require('./mobile/package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/MixOn-$version.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: MixOn-Android
          path: out/*.apk
          if-no-files-found: error

  # A release appears once per version: on the first push that brings a new version in package.json (or on a v* tag).
  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Which release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            publish=true
          else
            tag="v$(node -p "require('./package.json').version")"
            if gh release view "$tag" > /dev/null 2>&1; then publish=false; else publish=true; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Релиз $tag: $([ "$publish" = true ] && echo публикуется || echo уже есть)"
      - uses: actions/download-artifact@v8
        if: steps.version.outputs.publish == 'true'
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MixOn ${{ steps.version.outputs.tag }}
          body: |
            **Windows:** `MixOn-Setup-*.exe` — установщик. SmartScreen может предупредить, что издатель неизвестен: «Подробнее» → «Выполнить в любом случае».
            **Linux:** `*.AppImage` — сделайте файл исполняемым (`chmod +x`) и запустите.
            **Android:** `*.apk` — работает на телефоне сам, без компьютера: поиск сразу по ВК Музыке, YouTube Music, Deezer, Apple Music, SoundCloud и Jamendo, прослушивание, скачивание треков для офлайна, подписки на артистов, лайки, плейлисты и тексты песен хранятся на телефоне. Можно и подключиться к серверу MixOn: меню профиля → «Подключиться к серверу». Новая версия ставится поверх прежней, данные сохраняются. Если Play Protect предупредит о неизвестном разработчике — «Подробнее» → «Всё равно установить».

            Подробности — в README, раздел «Готовые приложения».
          generate_release_notes: true
          files: out/*
